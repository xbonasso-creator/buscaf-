<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Validar voucher — Buscafé</title>
<style>
  :root {
    --brand:     #C85C1A;
    --dark:      #3D1A0A;
    --light:     #F2E0D0;
    --bg:        #FAF3EA;
    --white:     #FFFFFF;
    --g200:      #E8DCC8;
    --g400:      #B0A89E;
    --g500:      #8B7355;
    --g900:      #1A1208;
    --success:   #2E7D32;
    --success-bg:#E8F5E9;
    --danger:    #B3261E;
    --danger-bg: #FCE8E6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--g900);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--white);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 4px 24px rgba(61,26,10,0.08);
    margin-top: 24px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header-icon {
    width: 100%;
    max-width: 220px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-icon img {
    width: 100%;
    height: auto;
    display: block;
  }
  .header-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 4px;
  }
  .header-sub {
    font-size: 13px;
    color: var(--g500);
    line-height: 1.5;
  }

  .field { margin-bottom: 16px; }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--g500);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  input[type=text], select {
    width: 100%;
    border: 1.5px solid var(--g200);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 18px;
    font-family: inherit;
    color: var(--g900);
    outline: none;
    background: var(--bg);
    transition: border-color .15s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input[type=text]:focus, select:focus {
    border-color: var(--brand);
    background: var(--white);
  }
  select {
    text-transform: none;
    letter-spacing: normal;
    font-size: 15px;
    cursor: pointer;
  }

  .btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
    font-family: inherit;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary {
    background: var(--dark);
    color: var(--white);
  }
  .btn-primary:hover:not(:disabled) { opacity: 0.9; }
  .btn-success {
    background: var(--brand);
    color: var(--white);
    margin-top: 12px;
  }
  .btn-success:hover:not(:disabled) { opacity: 0.9; }
  .btn-ghost {
    background: transparent;
    color: var(--g500);
    font-weight: 600;
    margin-top: 12px;
    padding: 10px;
  }

  /* Result states */
  .result {
    margin-top: 20px;
    border-radius: 14px;
    padding: 20px;
    display: none;
  }
  .result.show { display: block; }

  .result-available {
    background: var(--success-bg);
    border: 1.5px solid #A5D6A7;
  }
  .result-used {
    background: var(--danger-bg);
    border: 1.5px solid #F1AAA4;
  }
  .result-notfound {
    background: var(--bg);
    border: 1.5px solid var(--g200);
  }
  .result-confirmed {
    background: var(--success-bg);
    border: 1.5px solid #A5D6A7;
    text-align: center;
  }

  .result-icon {
    font-size: 28px;
    margin-bottom: 8px;
    display: block;
  }
  .result-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .result-available .result-title { color: var(--success); }
  .result-used .result-title { color: var(--danger); }
  .result-notfound .result-title { color: var(--g500); }
  .result-confirmed .result-title { color: var(--success); }

  .result-body {
    font-size: 13px;
    color: var(--g500);
    line-height: 1.5;
  }

  .stats-link {
    text-align: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--g200);
  }
  .stats-link a {
    font-size: 12px;
    color: var(--g500);
    text-decoration: underline;
  }

  .config-warning {
    background: #FEF3E2;
    border: 1.5px solid #E8B84B;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12px;
    color: #6B4E1E;
    line-height: 1.5;
    margin-bottom: 20px;
    display: none;
  }
  .config-warning.show { display: block; }
  .config-warning code {
    background: rgba(0,0,0,0.06);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

    </a>
  </div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIGURACIÓN — completar antes de publicar
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL      = "https://xoddmbesiurqcxftjpqh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvZGRtYmVzaXVycWN4ZnRqcHFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MzQ0MjksImV4cCI6MjA5ODMxMDQyOX0.c88uRsW-64-XOeDPEZOHhJ6tDiXsomt8CPOPCDQ7s2I";

// Lista de cafeterías — completar con las founders que participen de esta promo
// id: el id real de la cafetería en la tabla cafes (es tipo texto, no uuid)
const CAFETERIAS = [
  // Ejemplo de cómo agregar una:
  // { id: "cafe_001", name: "Nombre de la cafetería" },
];

// ═══════════════════════════════════════════════════════════════

let currentCode = null;

// Mostrar warning si faltan credenciales
if (SUPABASE_URL.includes("TU_SUPABASE") || SUPABASE_ANON_KEY.includes("TU_SUPABASE")) {
  document.getElementById("configWarning").classList.add("show");
  document.getElementById("searchBtn").disabled = true;
}

async function supabaseRPC(fnName, params) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: JSON.stringify(params),
  });
  if (!res.ok) throw new Error(`Error ${res.status}`);
  return res.json();
}

async function searchVoucher() {
  const input = document.getElementById("codeInput");
  let code = input.value.trim().toUpperCase();
  if (!code) return;

  // Auto-agregar prefijo BC- si el usuario solo tipeó el sufijo
  if (!code.startsWith("BC-") && code.length <= 4) {
    code = "BC-" + code;
  }

  const btn = document.getElementById("searchBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Buscando...';

  try {
    const data = await supabaseRPC("check_voucher", { code });
    const result = Array.isArray(data) ? data[0] : data;
    renderResult(code, result);
  } catch (err) {
    renderError();
  } finally {
    btn.disabled = false;
    btn.textContent = "Buscar código";
  }
}

function renderResult(code, result) {
  currentCode = code;
  const box = document.getElementById("resultBox");
  box.classList.add("show");

  if (!result || !result.found) {
    box.className = "result result-notfound show";
    box.innerHTML = `
      <span class="result-icon">🔍</span>
      <div class="result-title">Código no encontrado</div>
      <div class="result-body">Revisá que esté bien escrito. El formato es BC- seguido de 4 caracteres.</div>
      <button class="btn btn-ghost" onclick="resetForm()">Buscar otro código</button>
    `;
    return;
  }

  if (result.used) {
    box.className = "result result-used show";
    box.innerHTML = `
      <span class="result-icon">🚫</span>
      <div class="result-title">Este voucher ya fue usado</div>
      <div class="result-body">${result.user_name || "Este cliente"} ya canjeó su 15% de bienvenida anteriormente. No puede volver a usarlo.</div>
      <button class="btn btn-ghost" onclick="resetForm()">Buscar otro código</button>
    `;
    return;
  }

  // Disponible — mostrar selector de cafetería y confirmar
  const cafeOptions = CAFETERIAS.length > 0
    ? CAFETERIAS.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
    : `<option value="">— Agregar cafeterías en la config —</option>`;

  box.className = "result result-available show";
  box.innerHTML = `
    <span class="result-icon">✅</span>
    <div class="result-title">Voucher disponible</div>
    <div class="result-body">${result.user_name || "Este cliente"} puede usar su 15% OFF en una bebida con café.</div>
    <div class="field" style="margin-top:14px;">
      <label class="field-label">Tu cafetería</label>
      <select id="cafeSelect">
        <option value="">Seleccioná tu local</option>
        ${cafeOptions}
      </select>
    </div>
    <button class="btn btn-success" id="confirmBtn" onclick="confirmRedeem()">
      Marcar como usado
    </button>
    <button class="btn btn-ghost" onclick="resetForm()">Cancelar</button>
  `;
}

async function confirmRedeem() {
  const cafeSelect = document.getElementById("cafeSelect");
  const cafeId = cafeSelect.value;

  if (!cafeId) {
    cafeSelect.style.borderColor = "var(--danger)";
    return;
  }

  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Confirmando...';

  try {
    const success = await supabaseRPC("redeem_voucher", { code: currentCode, cafe_id: cafeId });

    if (success) {
      const box = document.getElementById("resultBox");
      box.className = "result result-confirmed show";
      box.innerHTML = `
        <span class="result-icon">🤎</span>
        <div class="result-title">¡Listo! Voucher canjeado</div>
        <div class="result-body">Aplicá el 15% de descuento en la bebida con café.</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="resetForm()">
          Validar otro código
        </button>
      `;
    } else {
      renderError("Este voucher ya había sido usado justo ahora. No se pudo aplicar dos veces.");
    }
  } catch (err) {
    renderError();
  }
}

function renderError(msg) {
  const box = document.getElementById("resultBox");
  box.className = "result result-notfound show";
  box.innerHTML = `
    <span class="result-icon">⚠️</span>
    <div class="result-title">Algo salió mal</div>
    <div class="result-body">${msg || "No pudimos conectar. Probá de nuevo en un momento."}</div>
    <button class="btn btn-ghost" onclick="resetForm()">Volver a intentar</button>
  `;
}

function resetForm() {
  document.getElementById("codeInput").value = "";
  document.getElementById("resultBox").classList.remove("show");
  document.getElementById("codeInput").focus();
}

// Enter para buscar
document.getElementById("codeInput").addEventListener("keydown", e => {
  if (e.key === "Enter") searchVoucher();
});
</script>
</body>
</html>
